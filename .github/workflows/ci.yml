name: CI & Marketplace Action Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Run Unit Tests
        run: npm test

      - name: Run End-to-End & Benchmark Tests
        run: npm run test:e2e

  action-test:
    name: Verify GitHub Action Self-Execution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test ContextDiet Action
        id: contextdiet
        uses: ./
        with:
          path: './test/fixtures/benchmark-project/ts-service'
          focus: 'src/index.ts'
          output: 'packed-context.md'
          format: 'md'
          summary: 'true'

      - name: Verify Action Outputs
        run: |
          echo "Output File: ${{ steps.contextdiet.outputs.output-file }}"
          echo "Tokens Saved: ${{ steps.contextdiet.outputs.tokens-saved }}"
          echo "Reduction %: ${{ steps.contextdiet.outputs.reduction-percentage }}"
          test -f packed-context.md
